   两种跑法都是纯本地（server.mjs 只监听 127.0.0.1，数据不出本机），
   所以正常情况不显示任何模式标签。
   只有「真的会降级」时才显示 —— 必须同时满足两条：
     1. file:// 打开（http 下 background.jpg 是同源的，画布不会被污染）
     2. bg-data.js 不在（没有内嵌的 data:URL，裸路径跨源 -> 画布被污染 ->
        getImageData 和 texImage2D 全抛 SecurityError -> 玻璃和描边层降级）
   光看 protocol 不够：有 bg-data.js 时 file:// 同样是完整玻璃，
   这时候还挂一个「兼容模式」就是误报了。
   判断只依赖这两条，不等 glass-gl 加载完成（要走 CDN，约 4 秒），
   因此不会出现先闪一下再变的文案。 */
const IS_FILE_PROTOCOL = location.protocol === 'file:';
const NEEDS_FALLBACK   = IS_FILE_PROTOCOL && !window.__bgData;

function applyModeTag(){
  if(NEEDS_FALLBACK){
    modeTag.hidden = false;
    modeTag.textContent = '兼容模式';
    modeTag.title = '当前以 file:// 打开，且缺少 bg-data.js：'
                  + '背景图是跨源的，浏览器禁止读取它的像素，画布被标记为"已污染"，'
                  + '分割线/文字阴影的亮度自适应和液态玻璃都已降级。\n'
                  + '把 bg-data.js 和 index.html 放在同一个目录即可恢复完整效果；'
                  + '它由 background.jpg 生成，换背景图后需重新运行「重新生成 bg-data.ps1」。';
  }else{
    // http 下同源，或 file:// 下有内嵌 data:URL —— 都是完整玻璃，无需任何模式提示
    modeTag.hidden = true;
    modeTag.removeAttribute('title');
  }
  modeTag.setAttribute('role','status');
  return modeTag.hidden ? '(不显示)' : modeTag.textContent;
}

/* ---------- 启动：先定好模式文案，再渲染背景，最后异步加载玻璃 ---------- */
applyModeTag();
sizeCanvas();
navPlace(0, false);   // 先给指示块一个非零宽度，visibleGlassEls 才会把它交给 glass-gl
initStroke();
renderBackground();
loadBackgroundImage();

/* 液态流动：与参考文件一致，玻璃色调持续循环 + 液面强度波动 */
let hue = 0, frame = 0;
(function animateGlass(){
  frame++;
  hue = (hue + 0.08) % 360;
  if(glass && glass.setParams){
    glass.setParams({
      tint: hslToRgb(hue/360, 0.45, 0.88),
      liquidness: 0.1 + Math.sin(frame*0.015)*0.02,
      lightAngle: 40 + Math.sin(frame*0.006)*8
    });
  }
  requestAnimationFrame(animateGlass);
})();

/* ---------- 尺寸变化 ---------- */
let resizeTimer;
window.addEventListener('resize', ()=>{
  sizeCanvas();                                              // 画布即时跟随，避免拉伸
  navPlace(navActive, false);                                // 指示块重新贴合（走 0.28s 过渡，不做形变）
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderBackground, 150);           // 背景重绘防抖
});

/* ---------- 搜索框的开合 ---------- */
/* 平时 display:none，量出来宽高都是 0，initGlass 里那遍 visibleGlassEls
   自然不会把它交给 glass-gl，描边层每帧那遍也会跳过它。
   所以第一次打开时必须补注册一次。玻璃是异步从 CDN 加载的（约 4s），
   两条路径都要留：
     先开框、后加载玻璃 -> initGlass 里的 visibleGlassEls 会带上它（在 initGlass 末尾置位）
     先加载玻璃、后开框 -> 这里的 registerSearchGlass 补上
   两条路径都跑的话会向 glass-gl 注册两次、画出重影，所以用 searchGlassOn 挡掉。 */
let searchGlassOn = false;
function registerSearchGlass(){
  if(glass && glass.register && !searchGlassOn){
    glass.register(searchBar, { radius: SEARCH_R });
    searchGlassOn = true;
  }
}

let searchClosing = false;
function searchOpen(){
  if(!searchBar.hidden) return;
  searchBar.hidden = false;
  searchBar.classList.remove('closing');
  searchClosing = false;
  registerSearchGlass();
  void searchBar.offsetWidth;        /* 强制回流：不然 width:0 -> var(--sb-w)
                                         会被当成同一帧的两个值，过渡不跑 */
  searchBar.classList.add('open');
  /* 刻意不 focus。focus() 会当场拉起软键盘，键盘一顶可视区被压掉一大截，
     刚弹出来的胶囊就被顶出屏幕，弹出动画也就白做了。
     要输入点一下框就行 —— 原生行为，点 input 自然会 focus 并拉起键盘。
     收起逻辑不依赖焦点状态：外面点击走的是 searchBar.contains(e.target)，
     Esc 挂在 document 上，都跟 input 有没有焦点无关。 */
}
function searchClose(){
  if(searchBar.hidden || searchClosing) return;
  searchClosing = true;
  searchBar.classList.remove('open');
  searchBar.classList.add('closing');
  searchInput.blur();
}
function searchToggle(){
  (searchBar.hidden || searchClosing) ? searchOpen() : searchClose();
}
/* 收起动画走完才 display:none。中途不能提前藏：那一下宽高直接变 0，
   玻璃和描边环会在一帧里从"细条"塌成"没有"，看着是闪断。 */
searchBar.addEventListener('transitionend', e=>{
  if(e.propertyName !== 'width' || !searchBar.classList.contains('closing')) return;
  searchBar.hidden = true;
  searchBar.classList.remove('closing');
  searchClosing = false;
});
/* 窗口尺寸变了要重算 --sb-w（它是 vw 相关的），收着的状态直接重置，
   免得留下一个半开的胶囊。 */
window.addEventListener('resize', ()=>{
  if(searchBar.hidden || searchClosing) return;
  searchBar.classList.remove('open');
  void searchBar.offsetWidth;
  searchBar.classList.add('open');
});

buttons[1].addEventListener('click', ()=>{ searchToggle(); });
/* 输入本身还不做检索，先把值打出来，等具体搜索逻辑 */
searchInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') console.log('搜索乐谱：', searchInput.value.trim());
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && !searchBar.hidden) searchClose();
});
/* 点外面收起。用捕获阶段，抢在输入框自己的事件之前判断；
   点搜索按钮本身不算"外面"，否则会在 click 收起之前先被判一次。 */
document.addEventListener('pointerdown', e=>{
  if(searchBar.hidden || searchClosing) return;
  if(searchBar.contains(e.target) || buttons[1].contains(e.target)) return;
  searchClose();
}, true);

/* ---------- 按钮交互占位：菜单逻辑待接入 ---------- */
buttons[0].addEventListener('click', ()=>console.log('打开菜单'));

/* 玻璃异步加载 */
initGlass();
/* CDN 极端情况卡住时的兜底：8s 后无论如何放行玻璃块 */
setTimeout(()=>{ navPill.style.visibility = 'visible'; }, 8000);
</script>
</body>
</html>
